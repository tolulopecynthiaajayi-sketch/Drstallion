<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="partyGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="40%" stop-color="#190a2a"/>
      <stop offset="100%" stop-color="#0a0312"/>
    </radialGradient>
    <radialGradient id="cakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="7" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="768" fill="url(#partyGlow)"/>

  <!-- Starburst Energy Rays -->
  <g opacity="0.25">
    <polygon points="512,384 400,0 480,0" fill="#f59e0b"/>
    <polygon points="512,384 620,0 700,0" fill="#ec4899"/>
    <polygon points="512,384 880,100 940,160" fill="#3b82f6"/>
    <polygon points="512,384 1024,280 1024,360" fill="#f59e0b"/>
    <polygon points="512,384 1024,480 1024,560" fill="#10b981"/>
    <polygon points="512,384 880,680 940,740" fill="#ec4899"/>
    <polygon points="512,384 620,768 700,768" fill="#3b82f6"/>
    <polygon points="512,384 320,768 400,768" fill="#f59e0b"/>
    <polygon points="512,384 80,680 140,740" fill="#ec4899"/>
    <polygon points="512,384 0,480 0,560" fill="#3b82f6"/>
    <polygon points="512,384 0,200 0,280" fill="#10b981"/>
    <polygon points="512,384 120,40 180,100" fill="#f59e0b"/>
  </g>

  <!-- Exploding Digital Confetti & Ribbons -->
  <g id="confetti">
    <!-- Streamers -->
    <path d="M 120 180 Q 160 220 140 280 T 180 340" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 880 160 Q 840 220 870 280 T 830 360" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 220 90 Q 280 130 250 180" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <path d="M 760 90 Q 720 140 750 190" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

    <!-- Colorful Confetti Bits -->
    <rect x="180" y="240" width="16" height="10" rx="2" fill="#e11d48" transform="rotate(25 180 240)"/>
    <rect x="260" y="160" width="14" height="8" rx="2" fill="#3b82f6" transform="rotate(-35 260 160)"/>
    <rect x="340" y="110" width="18" height="12" rx="2" fill="#f59e0b" transform="rotate(45 340 110)"/>
    <rect x="680" y="120" width="14" height="9" rx="2" fill="#ec4899" transform="rotate(15 680 120)"/>
    <rect x="790" y="170" width="16" height="10" rx="2" fill="#10b981" transform="rotate(-20 790 170)"/>
    <rect x="860" y="250" width="12" height="14" rx="2" fill="#f59e0b" transform="rotate(60 860 250)"/>
    <circle cx="150" cy="310" r="7" fill="#facc15"/>
    <circle cx="230" cy="220" r="6" fill="#a855f7"/>
    <circle cx="310" cy="180" r="8" fill="#38bdf8"/>
    <circle cx="720" cy="180" r="7" fill="#f43f5e"/>
    <circle cx="820" cy="220" r="9" fill="#facc15"/>
    <circle cx="910" cy="310" r="6" fill="#a855f7"/>
    <polygon points="190,140 200,160 180,160" fill="#facc15"/>
    <polygon points="840,130 850,150 830,150" fill="#38bdf8"/>
  </g>

  <!-- Glowing Digital Alarm Clock on Wall/Nightstand: 12:00 AM -->
  <g transform="translate(60, 80)" filter="url(#popShadow)">
    <rect x="0" y="0" width="170" height="65" rx="8" fill="#000" stroke="#f59e0b" stroke-width="4"/>
    <text x="85" y="44" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#ef4444" text-anchor="middle">12:00 AM</text>
    <rect x="15" y="-12" width="140" height="20" rx="4" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="85" y="2" font-family="'Impact', sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">MIDNIGHT DROP!</text>
  </g>

  <!-- Bed & Surprised Waking TRB -->
  <!-- Headboard -->
  <path d="M 220 300 Q 512 260 804 300 L 804 550 L 220 550 Z" fill="#18181b" stroke="#000" stroke-width="6"/>

  <!-- TRB Sitting Bolt Upright, Joyfully Surprised -->
  <g transform="translate(360, 260)">
    <!-- Ears -->
    <ellipse cx="-65" cy="0" rx="14" ry="18" fill="#663c1f" stroke="#000" stroke-width="5"/>
    <ellipse cx="65" cy="0" rx="14" ry="18" fill="#663c1f" stroke="#000" stroke-width="5"/>

    <!-- Head -->
    <path d="M -60 -40 C -60 -110, 60 -110, 60 -40 C 60 30, 50 80, 0 90 C -50 80, -60 30, -60 -40 Z" fill="#784723" stroke="#000" stroke-width="6"/>
    <!-- Fade Hair -->
    <path d="M -60 -40 C -60 -115, 60 -115, 60 -40 C 60 -75, -60 -75, -60 -40 Z" fill="#18181b" stroke="#000" stroke-width="4"/>

    <!-- Party Hat Perched on His Head! -->
    <polygon points="0,-160 -40,-80 40,-80" fill="#f97316" stroke="#000" stroke-width="5"/>
    <circle cx="0" cy="-165" r="10" fill="#facc15" stroke="#000" stroke-width="3"/>
    <!-- Hat stripes -->
    <path d="M -15 -130 L 15 -130" stroke="#facc15" stroke-width="6"/>
    <path d="M -28 -105 L 28 -105" stroke="#3b82f6" stroke-width="6"/>

    <!-- Beard -->
    <path d="M -50 -5 Q 0 15 50 -5 Q 55 35 40 65 Q 0 95 -40 65 Q -55 35 -50 -5 Z" fill="#18181b"/>
    <path d="M -25 22 Q 0 15 25 22 Q 0 32 -25 22 Z" fill="#18181b"/>

    <!-- Surprised / Delighted Wide Open Eyes -->
    <circle cx="-30" cy="-10" r="15" fill="#fff" stroke="#000" stroke-width="4"/>
    <circle cx="-28" cy="-10" r="8" fill="#18181b"/>
    <circle cx="-25" cy="-13" r="3" fill="#fff"/>
    <circle cx="30" cy="-10" r="15" fill="#fff" stroke="#000" stroke-width="4"/>
    <circle cx="28" cy="-10" r="8" fill="#18181b"/>
    <circle cx="31" cy="-13" r="3" fill="#fff"/>

    <!-- Eyebrows (Arched in surprise) -->
    <path d="M -45 -34 Q -30 -44 -15 -34" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 15 -34 Q 30 -44 45 -34" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M -4 -6 L -6 12 Q 0 18 6 12 L 4 -6" fill="none" stroke="#522e14" stroke-width="4"/>

    <!-- Big Joyful Open Mouth Laughing / Celebrating! -->
    <path d="M -24 35 Q 0 75 24 35 Z" fill="#991b1b" stroke="#000" stroke-width="4"/>
    <path d="M -18 35 Q 0 45 18 35" fill="#fff" stroke="#000" stroke-width="2"/>
    <path d="M -12 55 Q 0 48 12 55 Q 0 70 -12 55 Z" fill="#f43f5e"/>

    <!-- Shoulders with Birthday Robe / T-shirt -->
    <path d="M -110 80 Q -60 55 0 55 Q 60 55 110 80 L 130 180 L -130 180 Z" fill="#2563eb" stroke="#000" stroke-width="6"/>
  </g>

  <!-- Duvet at Bed Bottom -->
  <path d="M 140 440 C 260 410, 764 410, 884 440 L 920 768 L 104 768 Z" fill="#f8fafc" stroke="#000" stroke-width="7"/>
  <path d="M 120 520 Q 512 560 904 520" fill="none" stroke="#cbd5e1" stroke-width="8"/>

  <!-- The Birthday Cake Hovering with Glowing Candles (Right Center) -->
  <circle cx="700" cy="460" r="160" fill="url(#cakeGlow)"/>

  <g transform="translate(680, 420)" filter="url(#popShadow)">
    <!-- Plate / Stand -->
    <ellipse cx="0" cy="80" rx="120" ry="25" fill="#f1f5f9" stroke="#000" stroke-width="6"/>

    <!-- Cake Bottom Tier -->
    <path d="M -90 60 L -90 10 C -90 -10, 90 -10, 90 10 L 90 60 C 90 80, -90 80, -90 60 Z" fill="#f97316" stroke="#000" stroke-width="6"/>
    <!-- Frosting Drips -->
    <path d="M -90 10 Q -70 30 -50 10 Q -30 35 -10 10 Q 10 35 30 10 Q 50 30 70 10 Q 90 25 90 10 C 90 -10, -90 -10, -90 10 Z" fill="#fff" stroke="#000" stroke-width="4"/>

    <!-- Cake Top Tier -->
    <path d="M -60 -5 L -60 -45 C -60 -60, 60 -60, 60 -45 L 60 -5 C 60 10, -60 10, -60 -5 Z" fill="#ea580c" stroke="#000" stroke-width="6"/>
    <!-- Top Frosting -->
    <path d="M -60 -45 Q -40 -30 -20 -45 Q 0 -30 20 -45 Q 40 -30 60 -45 C 60 -60, -60 -60, -60 -45 Z" fill="#fde047" stroke="#000" stroke-width="4"/>

    <!-- Two Big Birthday Candles: "3" and "9" -->
    <!-- Candle 3 -->
    <g transform="translate(-25, -75)">
      <text x="0" y="0" font-family="'Impact', sans-serif" font-size="44" font-weight="bold" fill="#3b82f6" stroke="#000" stroke-width="4" text-anchor="middle">3</text>
      <!-- Flame -->
      <path d="M 0 -38 C -8 -25, -4 -10, 0 -5 C 4 -10, 8 -25, 0 -38 Z" fill="#f59e0b"/>
      <path d="M 0 -30 C -4 -20, -2 -10, 0 -7 C 2 -10, 4 -20, 0 -30 Z" fill="#fef08a"/>
    </g>

    <!-- Candle 9 -->
    <g transform="translate(25, -75)">
      <text x="0" y="0" font-family="'Impact', sans-serif" font-size="44" font-weight="bold" fill="#ec4899" stroke="#000" stroke-width="4" text-anchor="middle">9</text>
      <!-- Flame -->
      <path d="M 0 -38 C -8 -25, -4 -10, 0 -5 C 4 -10, 8 -25, 0 -38 Z" fill="#f59e0b"/>
      <path d="M 0 -30 C -4 -20, -2 -10, 0 -7 C 2 -10, 4 -20, 0 -30 Z" fill="#fef08a"/>
    </g>
  </g>

  <!-- Joint Supplement Bottle Comically Standing Next to the Cake! -->
  <g transform="translate(860, 500)" filter="url(#popShadow)">
    <rect x="-30" y="-45" width="60" height="85" rx="8" fill="#ffffff" stroke="#000" stroke-width="5"/>
    <rect x="-24" y="-60" width="48" height="18" rx="4" fill="#3b82f6" stroke="#000" stroke-width="4"/>
    <rect x="-26" y="-20" width="52" height="40" fill="#fef08a" stroke="#000" stroke-width="2"/>
    <text x="0" y="-3" font-family="'Impact', sans-serif" font-size="11" fill="#000" text-anchor="middle">JOINT SUPP</text>
    <text x="0" y="12" font-family="'Impact', sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">39+ EXTRA</text>
  </g>

  <!-- Giant Comic Action Header Banner -->
  <g transform="translate(512, 70)" filter="url(#popShadow)">
    <path d="M -440 -35 L 440 -35 L 420 40 L -420 40 Z" fill="#ea580c" stroke="#000" stroke-width="6"/>
    <text x="0" y="18" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="bold" fill="url(#goldText)" stroke="#000" stroke-width="6" text-anchor="middle" letter-spacing="3">HAPPY 39TH BIRTHDAY TEMITOPE!</text>
  </g>

  <!-- Comic Outer Border -->
  <rect x="3" y="3" width="1018" height="762" fill="none" stroke="#000" stroke-width="6"/>
</svg>
