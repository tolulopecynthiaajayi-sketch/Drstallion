<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRTHDAY TEMITOPE — Cheers to 39! | THE TRB ISSUE</title>
    <!-- SEO & Metadata -->
    <meta name="description" content="Happy Birthday Dr. Temitope Richard-Banji! Cheers to 39. The TRB Special Confidential Folio.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #060608;
            --text-primary: #ffffff;
            --text-secondary: #d1d1d6;
            --text-muted: #8e8e93;

            /* Creative Multi-Shade Orange Palette */
            --orange-blaze: #FF6B00;       /* Signature Vibrant Orange */
            --orange-flame: #FF8533;       /* Bright Electric Orange */
            --orange-sunset: #EA580C;      /* Warm Radiant Sunset */
            --orange-amber: #F59E0B;       /* Warm Honey Gold & Amber */
            --orange-terracotta: #C2410C;  /* Deep Luxury Burnt Terracotta */
            --orange-rust: #9A3412;        /* Earthy Moody Rust */
            --orange-apricot: #FED7AA;     /* Soft Typographic Highlight */

            --accent-color: var(--orange-blaze);
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* ------------------------------------------------------------- */
        /* Ambient Creative Orange Backdrop with Faded Portrait          */
        /* ------------------------------------------------------------- */
        .ambient-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: #060608;
        }

        .ambient-faded-portrait {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            object-fit: cover;
            object-position: center 25%;
            opacity: 0.22;
            filter: grayscale(15%) contrast(1.3) brightness(0.92);
            mix-blend-mode: luminosity;
            animation: slowDrift 28s ease-in-out infinite alternate;
        }

        @keyframes slowDrift {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.05) translate(-1.5%, 1.2%); }
            100% { transform: scale(1.02) translate(1.2%, -1%); }
        }

        .ambient-orange-mesh {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 65% 55% at 18% 18%, rgba(255, 107, 0, 0.38) 0%, transparent 68%),
                radial-gradient(ellipse 55% 45% at 82% 78%, rgba(234, 88, 12, 0.32) 0%, transparent 65%),
                radial-gradient(circle 520px at 78% 22%, rgba(245, 158, 11, 0.28) 0%, transparent 60%),
                radial-gradient(circle 560px at 22% 82%, rgba(194, 65, 12, 0.30) 0%, transparent 65%),
                radial-gradient(ellipse 75% 50% at 50% 50%, rgba(255, 133, 51, 0.20) 0%, transparent 75%);
            mix-blend-mode: screen;
            animation: auraPulse 14s ease-in-out infinite alternate;
        }

        @keyframes auraPulse {
            0% { opacity: 0.75; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
            100% { opacity: 0.8; transform: scale(0.97); }
        }

        .ambient-vignette {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at center, transparent 32%, rgba(6, 6, 8, 0.65) 75%, #060608 100%),
                linear-gradient(180deg, rgba(6, 6, 8, 0.35) 0%, transparent 20%, transparent 80%, rgba(6, 6, 8, 0.85) 100%);
        }

        /* Subtle Luxury Film Grain */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.038;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            width: 100%;
            padding: clamp(2rem, 5vw, 3.5rem) clamp(1.5rem, 5vw, 4rem);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 20;
        }

        .music-pill-btn {
            position: absolute;
            right: clamp(1.5rem, 5vw, 4rem);
            background: rgba(14, 14, 18, 0.75);
            border: 1px solid rgba(255, 107, 0, 0.35);
            color: #ffffff;
            padding: 0.6rem 1.3rem;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 0.75rem;
            font-family: var(--font-sans);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.35s ease;
        }

        .music-pill-btn:hover {
            border-color: var(--orange-blaze);
            background: rgba(255, 107, 0, 0.14);
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.35);
            transform: translateY(-2px);
        }

        .music-pill-btn.playing {
            border-color: var(--orange-blaze);
            background: rgba(255, 107, 0, 0.22);
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.45);
        }

        .music-bars {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 12px;
            width: 12px;
        }

        .music-bars .bar {
            width: 2.5px;
            background: var(--orange-blaze);
            border-radius: 1px;
            height: 3px;
            transition: height 0.2s ease;
        }

        .music-pill-btn.playing .music-bars .bar-1 {
            animation: bounceBar 0.8s ease-in-out infinite alternate;
        }
        .music-pill-btn.playing .music-bars .bar-2 {
            animation: bounceBar 0.6s ease-in-out 0.2s infinite alternate;
        }
        .music-pill-btn.playing .music-bars .bar-3 {
            animation: bounceBar 0.9s ease-in-out 0.4s infinite alternate;
        }

        @keyframes bounceBar {
            0% { height: 3px; }
            100% { height: 12px; }
        }

        /* Floating Music Toast Notification */
        .music-toast {
            position: fixed;
            top: clamp(1rem, 3vw, 2rem);
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(14, 14, 18, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 107, 0, 0.4);
            border-radius: 50px;
            padding: 0.75rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255, 107, 0, 0.25);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .music-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .music-toast-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--orange-blaze), var(--orange-sunset));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.85rem;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.5);
        }

        .music-toast-meta {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .music-toast-kicker {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--orange-blaze);
            font-weight: 700;
        }

        .music-toast-title {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: #ffffff;
            font-style: italic;
        }

        .logo {
            max-width: 130px;
            height: auto;
            transition: transform 0.4s ease, filter 0.4s ease;
            filter: drop-shadow(0 0 25px rgba(255, 107, 0, 0.35));
        }

        .logo:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 35px rgba(255, 107, 0, 0.6));
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 2rem 4rem 2rem;
            position: relative;
            z-index: 10;
        }

        .kicker {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            margin-bottom: 2rem;
            font-weight: 600;
            color: var(--orange-apricot);
            background: rgba(255, 107, 0, 0.08);
            border: 1px solid rgba(255, 107, 0, 0.28);
            padding: 0.45rem 1.4rem;
            border-radius: 100px;
            display: inline-block;
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.12);
        }

        .headline {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 8vw, 6.2rem);
            line-height: 1.08;
            margin-bottom: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .headline em {
            background: linear-gradient(135deg, #FF8533 0%, #FF6B00 50%, #EA580C 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            font-weight: 400;
            text-shadow: none;
        }

        .subtitle {
            font-family: var(--font-serif);
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            font-style: italic;
            font-weight: 400;
            color: var(--orange-apricot);
            margin-bottom: 3.5rem;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            letter-spacing: 0.04em;
            transition: opacity 0.5s ease;
            text-shadow: 0 2px 25px rgba(255, 107, 0, 0.35);
        }

        /* Timer Grid & Multi-Shade Orange Capsules */
        .timer-grid {
            display: flex;
            gap: clamp(1.2rem, 3vw, 2.5rem);
            justify-content: center;
            flex-wrap: wrap;
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .timer-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 130px;
            padding: 1.75rem 2rem;
            background: rgba(14, 14, 18, 0.75);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }

        .timer-block:hover {
            transform: translateY(-4px);
        }

        /* Timer Block 1: Days — Signature Blaze Orange */
        .timer-block.block-days {
            border-color: rgba(255, 107, 0, 0.3);
        }
        .timer-block.block-days:hover {
            border-color: var(--orange-blaze);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(255, 107, 0, 0.25);
        }
        .timer-block.block-days .time-value {
            color: #ffffff;
        }
        .timer-block.block-days .time-label {
            color: var(--orange-blaze);
        }

        /* Timer Block 2: Hours — Bright Flame Orange */
        .timer-block.block-hours {
            border-color: rgba(255, 133, 51, 0.3);
        }
        .timer-block.block-hours:hover {
            border-color: var(--orange-flame);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(255, 133, 51, 0.25);
        }
        .timer-block.block-hours .time-value {
            color: #ffffff;
        }
        .timer-block.block-hours .time-label {
            color: var(--orange-flame);
        }

        /* Timer Block 3: Minutes — Radiant Sunset Orange */
        .timer-block.block-minutes {
            border-color: rgba(234, 88, 12, 0.3);
        }
        .timer-block.block-minutes:hover {
            border-color: var(--orange-sunset);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(234, 88, 12, 0.25);
        }
        .timer-block.block-minutes .time-value {
            color: #ffffff;
        }
        .timer-block.block-minutes .time-label {
            color: var(--orange-sunset);
        }

        /* Timer Block 4: Seconds — Warm Honey Amber */
        .timer-block.block-seconds {
            border-color: rgba(245, 158, 11, 0.3);
        }
        .timer-block.block-seconds:hover {
            border-color: var(--orange-amber);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(245, 158, 11, 0.25);
        }
        .timer-block.block-seconds .time-value {
            color: #ffffff;
        }
        .timer-block.block-seconds .time-label {
            color: var(--orange-amber);
        }

        .time-value {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 6vw, 4.5rem);
            font-weight: 500;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }

        .time-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            font-weight: 600;
        }

        /* Reveal State Elements */
        .unlock-btn {
            display: none;
            background: linear-gradient(135deg, var(--orange-blaze) 0%, var(--orange-sunset) 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 1.4rem 4rem;
            font-size: 0.95rem;
            font-family: var(--font-sans);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            cursor: pointer;
            text-decoration: none;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.45), 0 0 50px rgba(255, 107, 0, 0.25);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease forwards 0.4s, glowPulse 3s ease-in-out infinite alternate;
            position: relative;
            z-index: 10;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 10px 30px rgba(255, 107, 0, 0.45), 0 0 40px rgba(255, 107, 0, 0.2); }
            100% { box-shadow: 0 15px 45px rgba(255, 107, 0, 0.75), 0 0 70px rgba(255, 107, 0, 0.45); }
        }

        .unlock-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 20px 50px rgba(255, 107, 0, 0.75), 0 0 75px rgba(255, 107, 0, 0.5);
        }

        /* Direct Editorial Link */
        .preview-direct-link a:hover {
            color: var(--orange-apricot) !important;
            border-bottom-color: var(--orange-blaze) !important;
        }

        /* Animations & Utilities */
        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
            position: absolute;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Creative Multi-Shade Orange Ambient Background with Faded Portrait Watermark -->
    <div class="ambient-backdrop" aria-hidden="true">
        <img src="Magazine/Images/temi-portrait-hero.jpg" alt="" class="ambient-faded-portrait">
        <div class="ambient-orange-mesh"></div>
        <div class="ambient-vignette"></div>
    </div>

    <header>
        <img src="Magazine/Images/logo-orange.png" alt="TRB Dr. Stallion Logo" class="logo">
        <button class="music-pill-btn" id="musicToggleBtn" title="Play / Pause Nathaniel Bassey Praise Track">
            <div class="music-bars" id="musicBars">
                <span class="bar bar-1"></span>
                <span class="bar bar-2"></span>
                <span class="bar bar-3"></span>
            </div>
            <span id="musicLabel">Play Music</span>
        </button>
    </header>

    <main>
        <div class="kicker" id="kickerTag" title="Special Birthday Folio">Special Birthday Folio &bull; Vol. 39 &bull; Dr. Stallion</div>
        <h1 class="headline" id="mainHeadline">HAPPY BIRTHDAY <br><em>TEMITOPE</em></h1>
        <p class="subtitle" id="subtitleText">Cheers to 39!</p>

        <div class="timer-grid" id="timerGrid">
            <div class="timer-block block-days">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="timer-block block-hours">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="timer-block block-minutes">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="timer-block block-seconds">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <a href="magazine.html?autoplay=true" class="unlock-btn" id="unlockBtn">Enter The Magazine &bull; Read The TRB Issue</a>

        <div class="preview-direct-link" style="margin-top: 3.5rem; position: relative; z-index: 2;">
            <a href="magazine.html?autoplay=true" style="color: var(--text-muted); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; border-bottom: 1px dashed rgba(255, 107, 0, 0.4); padding-bottom: 2px; transition: all 0.3s ease;">
                Editorial Access &bull; Read The Issue
            </a>
        </div>
    </main>

    <!-- Music Toast Notification -->
    <div class="music-toast" id="musicToast">
        <div class="music-toast-icon">&#9835;</div>
        <div class="music-toast-meta">
            <span class="music-toast-kicker">Now Playing // Birthday Praise</span>
            <span class="music-toast-title">Nathaniel Bassey &bull; See What The Lord Has Done</span>
        </div>
    </div>

    <!-- Background Praise Music -->
    <audio id="bgMusic" loop preload="metadata">
        <source src="Magazine/Audio/nathaniel-bassey-see-what-the-lord-has-done.mp3" type="audio/mpeg">
        <source src="SEE%20WHAT%20THE%20LORD%20HAS%20DONE%20-%20NATHANIEL%20BASSEY%20%23seewhatthelordhasdone%20%23hallelujahagain%20%23namesofGod.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Target Date: October 24, 2026, at 00:00:00 Irish Standard Time (UTC+1)
        const targetDate = new Date("2026-10-24T00:00:00+01:00").getTime();

        const timerGrid = document.getElementById('timerGrid');
        const subtitleText = document.getElementById('subtitleText');
        const kickerTag = document.getElementById('kickerTag');
        const unlockBtn = document.getElementById('unlockBtn');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        // Background Praise Audio Controller
        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicLabel = document.getElementById('musicLabel');
        const musicToast = document.getElementById('musicToast');
        let musicToastTimeout;

        function showMusicToast() {
            if (!musicToast) return;
            musicToast.classList.add('show');
            clearTimeout(musicToastTimeout);
            musicToastTimeout = setTimeout(() => {
                musicToast.classList.remove('show');
            }, 5000);
        }

        function startMusicPlayback() {
            if (!bgMusic) return;
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    if (musicToggleBtn) musicToggleBtn.classList.add('playing');
                    if (musicLabel) musicLabel.textContent = 'Music: On';
                    showMusicToast();
                }).catch(err => {
                    console.log('Autoplay deferred pending user interaction:', err);
                    // Modern browsers restrict zero-gesture audio autoplay.
                    // Start immediately upon the user's first tap or click anywhere.
                    const startOnFirstGesture = () => {
                        if (bgMusic && bgMusic.paused) {
                            bgMusic.play().then(() => {
                                if (musicToggleBtn) musicToggleBtn.classList.add('playing');
                                if (musicLabel) musicLabel.textContent = 'Music: On';
                                showMusicToast();
                            }).catch(e => console.log('Gesture play error:', e));
                        }
                        window.removeEventListener('click', startOnFirstGesture);
                        window.removeEventListener('touchstart', startOnFirstGesture);
                    };
                    window.addEventListener('click', startOnFirstGesture, { once: true, passive: true });
                    window.addEventListener('touchstart', startOnFirstGesture, { once: true, passive: true });
                });
            }
        }

        function toggleMusic() {
            if (!bgMusic) return;
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    if (musicToggleBtn) musicToggleBtn.classList.add('playing');
                    if (musicLabel) musicLabel.textContent = 'Music: On';
                    showMusicToast();
                }).catch(err => {
                    console.log('Audio play error:', err);
                });
            } else {
                bgMusic.pause();
                if (musicToggleBtn) musicToggleBtn.classList.remove('playing');
                if (musicLabel) musicLabel.textContent = 'Play Music';
            }
        }

        if (musicToggleBtn) {
            musicToggleBtn.addEventListener('click', toggleMusic);
        }

        let isRevealed = false;

        function updateCountdown() {
            if (isRevealed) return;

            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                triggerReveal();
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update DOM with padded values
            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        function triggerReveal() {
            if (isRevealed) return;
            isRevealed = true;
            
            // Hide timer grid gracefully
            timerGrid.classList.add('hidden');
            
            // Start Nathaniel Bassey praise track automatically
            startMusicPlayback();
            
            // Wait slightly for transition then update celebratory state
            setTimeout(() => {
                subtitleText.style.opacity = 0;
                setTimeout(() => {
                    if (kickerTag) kickerTag.textContent = "Celebration Active • Volume 39 Unlocked";
                    subtitleText.textContent = "Happy Birthday Temitope, Cheers to 39! The confidential folio is now officially open.";
                    subtitleText.style.opacity = 1;
                    
                    // Show button linking to magazine with autoplay
                    unlockBtn.style.display = 'inline-block';
                    
                    // Trigger confetti
                    triggerConfetti();
                }, 300);
            }, 200);
        }

        function triggerConfetti() {
            const duration = 6 * 1000;
            const animationEnd = Date.now() + duration;

            (function frame() {
                // Left side confetti
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0 },
                    colors: ['#ffffff', '#0a0a0a', '#FF6B00', '#EA580C', '#F59E0B']
                });
                // Right side confetti
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1 },
                    colors: ['#ffffff', '#0a0a0a', '#FF6B00', '#EA580C', '#F59E0B']
                });

                if (Date.now() < animationEnd) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Check URL parameters for testing/previewing the timer-ended state: ?test=true or ?reveal=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('test') === 'true' || urlParams.get('reveal') === 'true') {
            triggerReveal();
        } else {
            // Initialize standard countdown
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        // Allow previewing the revealed state by clicking the kicker tag
        if (kickerTag) {
            kickerTag.style.cursor = 'pointer';
            kickerTag.addEventListener('click', () => {
                triggerReveal();
            });
        }

    </script>
</body>
</html>
